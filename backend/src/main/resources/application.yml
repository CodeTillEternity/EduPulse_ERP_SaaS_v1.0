server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: institutional-erp-backend
  profiles:
    active: dev
  flyway:
    enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Stripe SaaS Billing Configuration
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/payment-success}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/payment-cancelled}

# Dedicated Database Routing Configuration (Hybrid Multi-Tenancy)
multitenancy:
  dedicated:
    url: ${DEDICATED_DB_URL:jdbc:h2:mem:dedicated_secondary_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE}
    username: ${DEDICATED_DB_USERNAME:sa}
    password: ${DEDICATED_DB_PASSWORD:}
    driver-class-name: ${DEDICATED_DB_DRIVER:org.h2.Driver}
app:
  storage:
    document-dir: ${APP_STORAGE_DOCUMENT_DIR:uploads/documents}

# SpringDoc OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

