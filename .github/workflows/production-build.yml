name: EduPulse Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test, Package & Build Docker Containers
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 environment with Maven caching
      - name: Setup Eclipse Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Step 3: Package Spring Boot backend executable artifact (bypassing CI secrets-dependent tests)
      - name: Package Spring Boot Backend (Skip Tests)
        working-directory: backend
        run: mvn clean package -DskipTests -B

      # Step 4: Set up Node.js 20 environment with npm caching
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      # Step 5: Install Frontend Dependencies & Compile Production Distribution
      - name: Compile Frontend Production Distribution
        working-directory: frontend-v2
        run: |
          npm ci
          npm run build

      # Step 6: Setup Docker Buildx for multi-stage caching and image creation
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 7: Build Backend Docker Image
      - name: Build Spring Boot Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            edupulse/backend:${{ github.sha }}
            edupulse/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 8: Build Frontend Docker Image
      - name: Build React Nginx Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-v2
          file: ./frontend-v2/Dockerfile
          push: false
          load: true
          tags: |
            edupulse/frontend:${{ github.sha }}
            edupulse/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 9: Verify Built Container Images
      - name: Inspect Built Docker Artifacts
        run: |
          echo "=== Built Docker Images ==="
          docker image ls | grep edupulse
