version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: edupulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edupulse_db}
      POSTGRES_USER: ${DB_USER:-edupulse_user}
      POSTGRES_PASSWORD: ${DB_PASS:-edupulse_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - edupulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edupulse_user} -d ${POSTGRES_DB:-edupulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 2. Redis Cache & Session Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: edupulse-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - edupulse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 3. Spring Boot SaaS ERP Backend
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupulse-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-edupulse_db}
      DB_USER: ${DB_USER:-edupulse_user}
      DB_PASS: ${DB_PASS:-edupulse_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_webhook_secret_placeholder}
      APP_STORAGE_DOCUMENT_DIR: /var/lib/edupulse/uploads
    volumes:
      - backend_uploads:/var/lib/edupulse/uploads
      - backend_logs:/var/log/edupulse
    ports:
      - "8081:8081"
    networks:
      - edupulse-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || curl -f http://localhost:8081/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ============================================================================
  # 4. React Single Page Application Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
    container_name: edupulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - edupulse-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==============================================================================
# Persistent Named Storage Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: edupulse_postgres_data
  redis_data:
    name: edupulse_redis_data
  backend_uploads:
    name: edupulse_backend_uploads
  backend_logs:
    name: edupulse_backend_logs

# ==============================================================================
# Isolated Internal Docker Network
# ==============================================================================
networks:
  edupulse-network:
    name: edupulse_network
    driver: bridge
